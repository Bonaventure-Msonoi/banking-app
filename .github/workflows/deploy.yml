name: Deploy Banking App

on:
  push:
    branches: [ main, demo ]
  pull_request:
    branches: [ main, demo ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      sqlite:
        image: nouchka/sqlite3:latest
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json
        coverage: none
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      
    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      
    - name: Install NPM Dependencies
      run: npm ci
      
    - name: Build Assets
      run: npm run build
      
    - name: Generate Application Key
      run: php artisan key:generate
      
    - name: Set Environment to Testing
      run: |
        echo "APP_ENV=testing" >> .env
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=:memory:" >> .env
        
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
        
    - name: Run Database Migrations
      run: php artisan migrate --force
      
    - name: Run Database Seeders
      run: php artisan db:seed --force
      
    - name: Run Tests
      run: vendor/bin/phpunit
      
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Dependencies
      run: |
        composer install --optimize-autoloader --no-dev
        npm ci
        npm run build
        
    - name: Create deployment artifact
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: tar -czf "${GITHUB_SHA}".tar.gz --exclude=*.git --exclude=node_modules *
      
    - name: Store artifact for distribution
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: ${{ github.sha }}.tar.gz
        
    - name: Deploy to Railway (if configured)
      if: env.RAILWAY_TOKEN != ''
      uses: railwayapp/cli@v3
      with:
        command: up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        
    - name: Deploy to Render (if configured)
      if: env.RENDER_API_KEY != ''
      run: |
        curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        
  notify:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Success
      if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' }}
      run: |
        echo "🎉 Banking App deployed successfully!"
        echo "✅ Tests passed"
        echo "✅ Deployment completed"
        
    - name: Notify Failure
      if: ${{ needs.test.result == 'failure' || needs.deploy.result == 'failure' }}
      run: |
        echo "❌ Deployment failed!"
        echo "Tests: ${{ needs.test.result }}"
        echo "Deploy: ${{ needs.deploy.result }}"
